name: Data migration (OIDC example)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: export or import
        required: true
        default: export
        type: choice
        options: [export, import]

permissions:
  id-token: write # required to request the GitHub OIDC token
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet build Source/DataMigration.csproj -c Release
      - name: Run migration
        working-directory: Source/bin/Release/net10.0
        run: >
          dotnet D365.Framework.Tools.DataMigration.dll
          --authtype GitHubOidc
          --tenantid "${{ vars.AZURE_TENANT_ID }}"
          --clientid "${{ vars.AZURE_CLIENT_ID }}"
          --url "${{ vars.D365_URL }}"
          --mode "${{ inputs.mode }}"
          --file "$GITHUB_WORKSPACE/data.json"
          --expconf "$GITHUB_WORKSPACE/exportconfig.xml"
          --returnError true
