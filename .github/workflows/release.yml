name: Release NuGet package

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    # Extra guard: only releases created by the repository owner are published.
    if: github.actor == github.repository_owner
    # Environment "nuget" must be configured with you as required reviewer.
    environment: nuget
    permissions:
      contents: write # attach the .nupkg to the GitHub release
      id-token: write # NuGet trusted publishing (OIDC), no API key needed
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Verify tag matches project version
        run: |
          VERSION=$(grep -oP '(?<=<PackageVersion>)[^<]+' Source/DataMigration.csproj)
          if [ "v$VERSION" != "${{ github.event.release.tag_name }}" ]; then
            echo "Tag ${{ github.event.release.tag_name }} does not match PackageVersion v$VERSION"; exit 1
          fi

      - run: dotnet pack Source/DataMigration.csproj -c Release -o out

      - name: Attach package to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" out/*.nupkg --clobber

      - name: NuGet login (trusted publishing)
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER }} # nuget.org profile name

      - name: Push to nuget.org
        run: dotnet nuget push out/*.nupkg --source https://api.nuget.org/v3/index.json --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --skip-duplicate
